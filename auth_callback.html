<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Auth Code</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1a1d21;
      --muted: #5c6570;
      --accent: #1a73e8;
      --accent-hover: #1558b0;
      --border: #e2e6ea;
      --code-bg: #f1f3f4;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }

    .card {
      width: min(560px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 8px 24px rgba(16, 24, 40, 0.06);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 600;
    }

    p {
      margin: 0 0 20px;
      color: var(--muted);
      line-height: 1.5;
    }

    .code-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }

    #code {
      flex: 1;
      margin: 0;
      padding: 12px 14px;
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      word-break: break-all;
      white-space: pre-wrap;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 0 18px;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover { background: var(--accent-hover); }
    button.copied { background: #188038; }

    .empty {
      color: var(--muted);
      font-style: italic;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Google auth code</h1>
    <p>Copy this code and paste it into the terminal when prompted.</p>
    <div class="code-row">
      <pre id="code" class="empty">Waiting for Google redirect…</pre>
      <button id="copy-btn" type="button" disabled>Copy</button>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const codeEl = document.getElementById("code");
    const copyBtn = document.getElementById("copy-btn");

    if (code) {
      codeEl.textContent = code;
      codeEl.classList.remove("empty");
      copyBtn.disabled = false;
    } else {
      codeEl.textContent = "No code in the URL. Sign in with Google first.";
    }

    copyBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(codeEl.textContent);
        copyBtn.textContent = "Copied!";
        copyBtn.classList.add("copied");
        setTimeout(() => {
          copyBtn.textContent = "Copy";
          copyBtn.classList.remove("copied");
        }, 2000);
      } catch {
        copyBtn.textContent = "Copy failed";
      }
    });
  </script>
</body>
</html>
